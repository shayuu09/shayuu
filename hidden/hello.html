<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8">
    <title>hello</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="cursor">
      <svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:svgjs="http://svgjs.dev/svgjs" viewBox="0 0 2000 2000">
        <g>
          <g fill="hsl(0, 0%, 100%)" id="star" transform="matrix(0.838670567945424,0.5446390350150271,-0.5446390350150271,0.838670567945424,682.4605838370038,-654.137003700564)">
            <path d="M 500 500 C 1000 1000 1000 1000 1300 750 C 1000 1000 1000 1000 2000 2000 C 1000 1000 1000 1000 750 1300 C 1000 1000 1000 1000 500 500" stroke-linecap="round" stroke-linejoin="round">
            </path>
          </g>
        </g>
      </svg>
    </div>
    <div id="heading"></div>
    <div id="cover"></div>
    <div id="content"></div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
      fetch('heading.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('heading').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('heading').innerHTML = 'Error loading heading';
          console.error('Error:', error);
        });

      fetch('cover.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('cover').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('cover').innerHTML = 'Error loading cover';
          console.error('Error:', error);
        });

      fetch('content.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('content').innerHTML = 'Error loading content';
          console.error('Error:', error);
        });
    </script>
    
    
<script>
$(document).mousemove(function(e) {
  // Directly update position on each mousemove
  $('#cursor').css({
    left: e.clientX,
    top: e.clientY
  });
});
</script>
  </body>
</html>
