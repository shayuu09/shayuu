<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8">
    <title>hello</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="heading"></div>
    <div id="cover"></div>
    <div id="content"></div>
    
    <script>
      
      fetch('heading.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('heading').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('heading').innerHTML = 'Error loading heading';
          console.error('Error:', error);
        });
      
      fetch('cover.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('cover').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('cover').innerHTML = 'Error loading cover';
          console.error('Error:', error);
        });
      
      fetch('content.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('content').innerHTML = html;
        })
        .catch(error => {
          document.getElementById('content').innerHTML = 'Error loading content';
          console.error('Error:', error);
        });
   </script>
  </body>
</html>
